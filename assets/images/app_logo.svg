<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Epic Deep Space Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1c"/>
      <stop offset="100%" stop-color="#1a2442"/>
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0082df"/>
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base (Rounded Rectangle) -->
  <rect width="400" height="400" rx="60" fill="url(#spaceBg)" stroke="#2b3a4a" stroke-width="8"/>

  <!-- Distant Stars -->
  <circle cx="80" cy="100" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="80" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="350" cy="300" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="60" cy="280" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="40" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="180" r="2" fill="#ffffff" opacity="0.2"/>
  <circle cx="280" cy="340" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Speed/Motion Lines -->
  <line x1="40" y1="120" x2="40" y2="240" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <line x1="360" y1="150" x2="360" y2="280" stroke="#ffffff" stroke-width="3" opacity="0.1" stroke-linecap="round"/>
  <line x1="90" y1="300" x2="90" y2="370" stroke="#ffffff" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <line x1="310" y1="320" x2="310" y2="380" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>

  <!-- Wing Lasers (Adjusted to hit the new asteroid correctly) -->
  <line x1="107" y1="240" x2="107" y2="40" stroke="url(#laserGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="293" y1="240" x2="293" y2="45" stroke="url(#laserGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- ========================================== -->
  <!-- THE NEW AND IMPROVED ASTEROID              -->
  <!-- ========================================== -->
  <g transform="translate(0, -65)">
    <!-- Main Craggy Asteroid Body -->
    <path d="M 120,30 L 150,45 L 200,20 L 240,40 L 280,35 L 310,60 L 300,90 L 320,110 L 280,120 L 240,105 L 200,125 L 160,115 L 120,125 L 90,100 L 70,80 L 100,50 Z" fill="#697677" stroke="#2b3a4a" stroke-width="8" stroke-linejoin="round"/>

    <!-- Craters (Darker) -->
    <path d="M 130,70 L 140,55 L 160,65 L 155,85 L 135,80 Z" fill="#4a5556"/>
    <path d="M 220,50 L 250,45 L 260,70 L 230,80 Z" fill="#4a5556"/>
    <path d="M 180,85 L 200,80 L 210,100 L 185,110 Z" fill="#4a5556"/>
    <path d="M 270,90 L 290,85 L 295,100 L 280,105 Z" fill="#4a5556"/>
    <path d="M 90,70 L 105,65 L 110,80 L 95,85 Z" fill="#4a5556"/>

    <!-- Rock Highlights (Lighter) -->
    <path d="M 120,30 L 150,45 L 200,20 L 180,45 Z" fill="#889798"/>
    <path d="M 280,35 L 310,60 L 290,70 L 260,50 Z" fill="#889798"/>
    <path d="M 100,50 L 130,55 L 110,70 Z" fill="#889798"/>

    <!-- Surface Cracks -->
    <path d="M 200,20 L 210,50 M 210,50 L 195,70 M 210,50 L 235,65 M 160,115 L 165,95 L 150,80 M 280,120 L 270,100 L 285,85" stroke="#4a5556" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Explosive Laser Impacts -->
    <!-- Left Impact -->
    <g transform="translate(107, 105)">
      <circle cx="0" cy="0" r="14" fill="#00ffff" filter="url(#glow)" opacity="0.8"/>
      <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="#ffffff"/>
      <circle cx="-15" cy="-15" r="3" fill="#00ffff"/>
      <circle cx="15" cy="-10" r="2" fill="#ffffff"/>
      <circle cx="10" cy="15" r="4" fill="#00ffff"/>
    </g>

    <!-- Right Impact -->
    <g transform="translate(293, 110)">
      <circle cx="0" cy="0" r="14" fill="#00ffff" filter="url(#glow)" opacity="0.8"/>
      <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="#ffffff"/>
      <circle cx="-10" cy="15" r="3" fill="#00ffff"/>
      <circle cx="15" cy="-15" r="4" fill="#ffffff"/>
      <circle cx="20" cy="10" r="2" fill="#00ffff"/>
    </g>

    <!-- Asteroid Debris flying off -->
    <!-- Left side Debris -->
    <polygon points="65,115 75,105 85,125 70,135" fill="#697677" stroke="#2b3a4a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="45,90 60,85 55,105" fill="#4a5556" stroke="#2b3a4a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="80,145 90,140 95,155" fill="#889798" stroke="#2b3a4a" stroke-width="2" stroke-linejoin="round"/>

    <!-- Right side Debris -->
    <polygon points="325,130 340,120 350,140 330,145" fill="#697677" stroke="#2b3a4a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="340,80 360,75 350,95" fill="#889798" stroke="#2b3a4a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="310,155 320,150 325,165" fill="#4a5556" stroke="#2b3a4a" stroke-width="2" stroke-linejoin="round"/>

    <!-- Center floating chunks -->
    <polygon points="190,145 210,140 205,155" fill="#697677" stroke="#2b3a4a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="230,140 245,135 240,150" fill="#4a5556" stroke="#2b3a4a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- ========================================== -->
  <!-- YOUR EXACT SPACESHIP CODE                  -->
  <!-- ========================================== -->

  <!-- Exhaust Flame -->
  <polygon points="175,255 200,245 200,335" fill="#f05041"/>
  <polygon points="200,245 225,255 200,335" fill="#cb3122"/>

  <!-- Side Panels (Fins) -->
  <polygon points="156,206 85,250 130,276" fill="#0082df" stroke="#2b3a4a" stroke-width="10" stroke-linejoin="miter"/>
  <polygon points="244,206 315,250 270,276" fill="#0082df" stroke="#2b3a4a" stroke-width="10" stroke-linejoin="miter"/>

  <!-- Main Rocket Hull -->
  <polygon points="200,75 135,270 200,245 265,270" fill="#5883ff" stroke="#2b3a4a" stroke-width="12" stroke-linejoin="miter"/>

  <!-- Window -->
  <circle cx="200" cy="155" r="14" fill="#f3f6fa" stroke="#2b3a4a" stroke-width="6"/>

</svg>
